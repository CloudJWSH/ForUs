# Baut die Unterseiten der Website neu, wenn sich ihre Quellen ändern (website/src, website/tools, coin.json, site.json, assets),
# prüft Links, Geheimnisse und Bildgrößen und lässt den Rauchtest im Browser laufen.
# Neue Versionen der Erweiterung baut pump-paper-release.yml.
name: Website bauen

on:
  push:
    paths:
      - "website/src/**"
      - "website/tools/**"
      - "website/coin.json"
      - "website/site.json"
      - "website/assets/**"
      - "website/index.html"
      - "website/en/index.html"
      - "website/strategien/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen
        run: |
          python3 -m pip install --quiet pillow
          python3 website/tools/build.py
      - name: Links, Barrierefreiheit und Geheimnisse prüfen
        run: python3 website/tools/check.py
      - name: Rechentests
        run: node website/tools/test-rechnen.js
      - name: Rauchtest im Browser
        run: |
          cd "$RUNNER_TEMP"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/node_modules" node "$GITHUB_WORKSPACE/website/tools/smoke.js"
      - name: Ergebnis einchecken
        run: |
          if [ -n "$(git status --porcelain website)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website
            git commit -m "Website neu gebaut"
            git push
          fi
