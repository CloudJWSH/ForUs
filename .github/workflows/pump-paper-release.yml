# Baut bei jeder neuen Version von Pump Paper (extension/manifest.json) die Zip,
# stellt sie als neuestes Release bereit und trägt die Version auf der Website ein.
# Der Download-Link der Website zeigt immer auf releases/latest/download/Pump-Paper.zip.
name: Pump Paper Release

on:
  push:
    paths:
      - "extension/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version lesen
        id: v
        run: echo "version=$(jq -r .version extension/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Zip bauen
        run: |
          mkdir -p dist/"Pump Paper"
          cp -r extension/. dist/"Pump Paper"/
          cd dist
          zip -rq Pump-Paper.zip "Pump Paper" -x "*.DS_Store"
          cp Pump-Paper.zip "Pump-Paper-${{ steps.v.outputs.version }}.zip"

      - name: Neuerungen der Version lesen
        run: |
          python3 - <<'PY' > dist/notes.md
          import re
          text = open("extension/CHANGELOG.md", encoding="utf-8").read()
          blocks = re.split(r"^## ", text, flags=re.M)[1:]
          ver = "${{ steps.v.outputs.version }}"
          block = next((b for b in blocks if b.split("·")[0].strip() == ver), "")
          items = [l for l in block.splitlines()[1:] if l.startswith("- ")]
          print("\n".join(items) if items else f"Pump Paper {ver}.")
          print("\nZip entpacken und unter chrome://extensions als entpackte Erweiterung laden.")
          PY

      - name: Release anlegen oder aktualisieren
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Pump-Paper.zip "dist/Pump-Paper-${{ steps.v.outputs.version }}.zip" --clobber
            gh release edit "$TAG" --latest --notes-file dist/notes.md
          else
            gh release create "$TAG" dist/Pump-Paper.zip "dist/Pump-Paper-${{ steps.v.outputs.version }}.zip" \
              --title "Pump Paper ${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" --latest \
              --notes-file dist/notes.md
          fi

      - name: Bilder der Erweiterung neu zeichnen
        continue-on-error: true
        run: |
          npm install --no-save --prefix /tmp/pw playwright@1.48.2
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium
          # Inter statt DejaVu als Systemschrift, sonst werden Knöpfe im Fenster abgeschnitten
          sudo apt-get install -y fonts-inter >/dev/null
          mkdir -p ~/.config/fontconfig
          printf '<?xml version="1.0"?><!DOCTYPE fontconfig SYSTEM "fonts.dtd"><fontconfig><alias><family>sans-serif</family><prefer><family>Inter</family></prefer></alias><alias><family>system-ui</family><prefer><family>Inter</family></prefer></alias></fontconfig>' > ~/.config/fontconfig/fonts.conf
          fc-cache -f >/dev/null
          NODE_PATH=/tmp/pw/node_modules node website/tools/shots/shots.js
          NODE_PATH=/tmp/pw/node_modules node website/tools/store/store.js

      - name: Website neu bauen (Version, Neuerungen, Änderungsprotokoll)
        run: |
          python3 -m pip install --quiet pillow
          python3 website/tools/build.py
          python3 website/tools/check.py
          if [ -n "$(git status --porcelain website)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add website
            git commit -m "Website: Pump Paper ${{ steps.v.outputs.version }}"
            git push
          fi
